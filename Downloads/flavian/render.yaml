services:
  - type: web
    name: laundry-bolt-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: laundry-bolt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_SEED
        value: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: laundry-bolt-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: laundry-bolt-backend
          type: web
          property: host
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          name: laundry-bolt-backend
          type: web
          property: host
      - key: MOCK_SEED
        value: false

databases:
  - name: laundry-bolt-db
    plan: free
